name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install source dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Test
        run: python -m pytest -v

  distribution-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install build frontend
        run: |
          python -m pip install build==1.3.0
          python -m pip check

      - name: Build wheel and sdist
        run: python -m build --sdist --wheel

      - name: Inspect distribution contents
        run: python scripts/validate_distribution.py dist

      - name: Validate installed wheel
        shell: bash
        run: |
          wheel_path="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          wheel_path="$(realpath "$wheel_path")"
          wheel_venv="$RUNNER_TEMP/villaz-router-wheel"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install "$wheel_path"
          cd "$RUNNER_TEMP"
          "$wheel_venv/bin/python" -m pip check
          "$wheel_venv/bin/python" "$GITHUB_WORKSPACE/scripts/validate_installed_package.py"
          "$wheel_venv/bin/python" -m villaz_router --help
          "$wheel_venv/bin/villaz-router" --help
