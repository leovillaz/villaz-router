[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "villaz-router"
version = "0.1.0"
description = "Router determinístico v1 do Villaz-Lab"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.12.0",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
