[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "villaz-router"
version = "0.1.0"
description = "Router determinístico v1 do Villaz-Lab"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Leandro Vilela" },
]
# Copyright 2026 Leandro Vilela
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi==0.141.1",
    "httpx2==2.12.0",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "uvicorn==0.52.4",
]

[project.urls]
Homepage = "https://github.com/leovillaz/villaz-router"
Repository = "https://github.com/leovillaz/villaz-router"
Issues = "https://github.com/leovillaz/villaz-router/issues"

[project.scripts]
villaz-router = "villaz_router.cli:main"

[project.optional-dependencies]
dev = [
    "anyio==4.14.2",
    "build==1.3.0",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"villaz_router.runtime_data" = [
    "config/*.yaml",
    "profiles/*.yaml",
    "rules/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
